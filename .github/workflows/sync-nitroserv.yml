name: Sync NitroServ Pack
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Sync mods
        timeout-minutes: 30
        env:
          SFTP_HOST: ${{ secrets.NITRO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.NITRO_SFTP_PORT }}
          SFTP_USER: ${{ secrets.NITRO_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.NITRO_SFTP_PASSWORD }}
          SFTP_MODS_PATH: ${{ secrets.NITRO_SFTP_MODS_PATH }}
        run: |
          mkdir -p server-pack-files/mods
          echo "Connexion SFTP à $SFTP_HOST:${SFTP_PORT:-22}..."
          timeout 1740s lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "${SFTP_PORT:-22}" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; set net:timeout 15; set net:max-retries 2; set net:reconnect-interval-base 3; mirror --verbose --delete \"${SFTP_MODS_PATH:-/mods}\" server-pack-files/mods; bye"
      - name: Prepare client pack
        run: |
          # WaterMedia is disabled on the dedicated server but required by
          # client-side WaterFrames / WaterVision. Re-enable only the core jar
          # for the client pack. The large native binaries stay excluded.
          WM="$(find server-pack-files/mods -maxdepth 1 -type f -name 'watermedia-*.jar.disabled' ! -name 'watermedia_binaries-*' ! -name 'watermedia_youtube_plugin-*' | head -n 1)"
          if [ -n "$WM" ]; then
            cp "$WM" "${WM%.disabled}"
            echo "Client dependency enabled: $(basename "${WM%.disabled}")"
          fi
          LARGE="$(find server-pack-files/mods -type f ! -name '*.disabled' -size +95M -print)"
          if [ -n "$LARGE" ]; then
            echo "::error::Active client file too large for GitHub:"
            echo "$LARGE"
            exit 1
          fi
      - name: Generate manifest
        run: python3 scripts/build-server-pack.py
      - name: Publish pack
        run: |
          git config user.name "Valhalla Sync"
          git config user.email "actions@users.noreply.github.com"
          git add server-pack.json
          git add server-pack-files/mods -- ":!server-pack-files/mods/*.disabled"
          git add -u server-pack-files/mods
          git diff --cached --quiet && exit 0
          git commit -m "Sync NitroServ server pack"
          git push
